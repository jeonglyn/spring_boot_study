spring:
  application:
    name: spring_boot_study
  datasource:
    url: jdbc:h2:mem:study;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console 로 접속해서 데이터 직접 확인 가능
  jpa:
    hibernate:
      ddl-auto: create-drop # 실습용: 애플리케이션 재시작마다 테이블 새로 생성
    show-sql: true # 실행되는 SQL 콘솔 출력 (학습용, 실무에서는 로그 레벨로 제어 권장)
    properties:
      hibernate:
        format_sql: true
